name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SnowIn and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Build distributions
        run: python -m build

      - name: Install wheel in isolated environment
        run: |
          python -m venv /tmp/snowin-wheel-smoke
          /tmp/snowin-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/snowin-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/snowin-wheel-smoke/bin/python -c "import snowin; print(snowin.__version__)"

      - name: Smoke-test console entry point
        run: /tmp/snowin-wheel-smoke/bin/snowin-plot-gunw --help
