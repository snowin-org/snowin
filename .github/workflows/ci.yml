name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SnowIn and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests and measure line coverage
        run: pytest -q --cov=snowin --cov-report=term-missing --cov-report=xml

      - name: Upload XML coverage report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  minimum-dependencies:
    name: Minimum scientific dependencies (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install earliest dependencies compatible with Python 3.12
        run: >-
          python -m pip install "numpy==1.26.4" "xarray==2024.1.1"
          "pytest>=8" "hypothesis>=6.100" "dask[array]>=2024.1" "h5py>=3.10"

      - name: Install SnowIn without replacing pinned scientific dependencies
        run: python -m pip install --no-deps -e .

      - name: Run scientific API tests on minimum dependencies
        run: >-
          pytest -q
          tests/test_dswe_kernel.py
          tests/test_dswe_methods.py
          tests/test_dswe_properties.py
          tests/test_reference.py
          tests/test_reference_properties.py
          tests/test_snow_depth_properties.py
          tests/test_temporal.py
          tests/test_temporal_properties.py
          tests/test_scientific_integration.py

  quality:
    name: Ruff and CLI checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SnowIn and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Smoke-test console entry point
        run: snowin-plot-gunw --help

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build frontend
        run: python -m pip install "build>=1.2"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Install wheel in a clean environment and exercise the public API
        run: |
          python -m venv /tmp/snowin-wheel-smoke
          /tmp/snowin-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/snowin-wheel-smoke/bin/python scripts/wheel_smoke.py
