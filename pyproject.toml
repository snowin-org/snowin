[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowin"
version = "0.1.0"
description = "Snow-focused SAR and InSAR workflows built on xarray"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "SnowIn contributors" }
]
dependencies = [
  "numpy>=1.24",
  "xarray>=2024.1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/snowin-org/snowin"
Repository = "https://github.com/snowin-org/snowin"
Issues = "https://github.com/snowin-org/snowin/issues"

[project.optional-dependencies]
nisar = [
  "nisar-pytools>=0.5.0",
  "h5py>=3.10",
  "h5netcdf>=1.3",
]
geometry = [
  "rasterio>=1.3",
  "scipy>=1.10",
]
dask = ["dask[array]>=2024.1"]

[dependency-groups]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "pytest-cov>=5",
  "pytest>=8",
  "ruff>=0.4",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
]
notebooks = [
  "earthaccess>=0.17",
  "fsspec>=2024.0",
  "geopandas>=0.14",
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.8",
  "pyproj>=3.6",
  "requests>=2.31",
  "rioxarray>=0.15",
  "s3fs>=2024.0",
  "shapely>=2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
filterwarnings = [
  "error::Warning:snowin(\\.|$)",
  'ignore:Use `@` matmul instead of `[*]` mul operator for matrix multiplication:PendingDeprecationWarning',
]
markers = [
  "integration: optional checks against externally supplied real-product data",
]

[tool.coverage.run]
source = ["snowin"]

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = ["*/tests/*"]
fail_under = 85

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
